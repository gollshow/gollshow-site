# Builds the site and publishes it to GitHub Pages (branch: gh-pages) on every
# push to main — including every "Save" in /admin, which commits to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Content entries are .md files too — only documentation is ignored here.
    paths-ignore:
      - 'README.md'
      - 'DESIGN.md'
      - 'IMPORT_REPORT.md'
      - '관리자_사용법.md'
      - '_check/**'
      - '_import/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Re-use optimised images between builds (AVIF/WebP encoding is the slow part).
      - uses: actions/cache@v4
        with:
          path: .cache/astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      - run: npm ci
      - run: npm run build
      - name: Stamp build
        run: echo "${GITHUB_SHA}" > dist/build.txt
      - name: Publish to the gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          # gh-pages always holds exactly one commit: the current build
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Check the live site
        run: |
          URL=$(node -e "import('./site.config.mjs').then(m => console.log(m.SITE + m.BASE))")
          echo "Live URL: $URL"
          for i in $(seq 1 40); do
            LIVE=$(curl -fsS "${URL}build.txt?ts=$(date +%s)" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              curl -fsS -o /dev/null -w "home: %{http_code}\n" "$URL"
              curl -fsS -o /dev/null -w "admin: %{http_code}\n" "${URL}admin/"
              echo "✓ $URL is serving ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::The new build was not visible at $URL after 10 minutes (Pages may still be publishing)."
