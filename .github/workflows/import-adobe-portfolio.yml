# One-off helper: snapshot the old Adobe Portfolio site (gollshow.com) from a
# GitHub runner and store the raw pages + full-size images on the
# `import-data` branch, so they can be turned into site content.
# Safe to delete once the migration is finished.
name: Import from Adobe Portfolio (snapshot)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, import-data]
    paths:
      - 'scripts/import/**'
      - '.github/workflows/import-adobe-portfolio.yml'

permissions:
  contents: write

concurrency:
  group: import-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl gollshow.com
        run: node scripts/import/crawl.mjs "$RUNNER_TEMP/snapshot"
      - name: Publish snapshot to the import-data branch
        run: |
          set -e
          SNAP="$RUNNER_TEMP/snapshot"
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan import-data
          git rm -rf --quiet . || true
          git clean -fdx --quiet
          cp -R "$SNAP"/. .
          git add -A
          git commit -q -m "Snapshot of gollshow.com ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f origin import-data
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot/manifest.json
