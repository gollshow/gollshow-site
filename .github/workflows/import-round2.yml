# One-off: downloads the old site's works listed in _import/adobe-2026-11-03.txt
# from cdn.myportfolio.com (the cloud session that prepared it could not reach
# the CDN; Actions runners can) and commits the result to the same branch.
name: Import works from the old-site data file

on:
  push:
    branches: ['claude/**']
    paths: ['_import/adobe-*.txt', 'scripts/import/from-data.mjs', '.github/workflows/import-round2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-round2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and write works
        run: node scripts/import/from-data.mjs _import/adobe-2026-11-03.txt
      - name: Commit to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A src/content src/assets/media _import
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -q -m "Import works from the old-site data file (Actions runner)"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
