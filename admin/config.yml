            hint: "그림 파일을 여기로 여러 장 끌어다 놓거나 한꺼번에 고르세요. \"저장\"을 누르면 아래 작품 목록 맨 위에 하나씩 들어갑니다. 2000–3000px 크기의 JPG를 권장합니다. 올리면 자동으로 웹용(WebP, 긴 변 최대 3000px)으로 저장됩니다."
