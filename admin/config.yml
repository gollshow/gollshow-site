# Generated from src/pages/admin/config.yml.ts
backend:
  name: "github"
  repo: "gollshow/gollshow-site"
  branch: "main"
  auth_methods:
    - "token"
  commit_messages:
    create: "추가: {{slug}}"
    update: "수정: {{slug}}"
    delete: "삭제: {{slug}}"
    uploadMedia: "이미지 업로드: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"
app_title: "gollshow 관리자"
site_url: "https://gollshow.com/"
display_url: "https://gollshow.com/"
logo:
  src: "https://gollshow.com/apple-touch-icon.png"
media_folder: "src/assets/media"
public_folder: "/src/assets/media"
media_libraries:
  default:
    config:
      max_file_size: 52428800
      transformations:
        raster_image:
          format: "webp"
          quality: 90
          width: 3000
          height: 3000
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
collections:
  -
    name: "settings"
    label: "사이트 설정"
    description: "메뉴 이름, 연락처, 첫 화면의 글자와 물감 색"
    files:
      -
        name: "site"
        label: "사이트 설정"
        file: "src/content/settings/site.yml"
        fields:
          -
            name: "wordmark"
            label: "첫 화면 글자"
            widget: "string"
            default: "gollshow"
            hint: "첫 화면에서 물감 속에서 모여드는 글자, 그리고 각 페이지 왼쪽 위의 작은 글자입니다."
          -
            name: "pigments"
            label: "첫 화면 물감 색"
            widget: "object"
            collapsed: false
            hint: "첫 화면에서 소용돌이치는 네 가지 물감 색입니다. 바꾸고 저장하면 몇 분 뒤 사이트에 반영됩니다."
