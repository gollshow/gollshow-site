                  -
                    label: "위"
                    value: "top"
                  -
                    label: "가운데"
                    value: "center"
                  -
                    label: "아래"
                    value: "bottom"
                hint: "맨 위 배너는 그림을 확대해 넓게 잘라 보여 줍니다. 어느 쪽을 남길지 고르세요."
              -
