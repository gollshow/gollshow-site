                hint: "2000–3000px 크기의 JPG를 권장합니다. 올리면 자동으로 웹용(WebP, 긴 변 최대 3000px)으로 저장됩니다."
              -
                name: "title_en"
                label: "제목 (영어)"
                widget: "string"
                required: false
                hint: "제목이 없으면 비워 두세요. 비워 두면 사이트에 제목이 나오지 않습니다."
              -
                name: "title_ko"
                label: "제목 (한국어)"
                widget: "string"
                required: false
                hint: "한국어 화면(KR)에서 보입니다. 비워 두면 영어 제목이 나옵니다."
              -
                name: "year"
                label: "연도"
                widget: "string"
                required: false
                hint: "예: 2024"
              -
                name: "material"
                label: "재료"
                widget: "string"
                required: false
                hint: "예: Oil on canvas"
              -
                name: "size"
                label: "크기"
                widget: "string"
                required: false
                hint: "예: 530 × 455 mm"
              -
                name: "note"
                label: "메모"
                widget: "string"
                required: false
                hint: "작품을 크게 볼 때 캡션 끝에 붙는 짧은 글"
              -
                name: "display"
                label: "화면 크기"
                widget: "select"
                default: "M"
